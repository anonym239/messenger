name: APK bauen

on:
  push:
    branches: [main]      # Neues Release: Zahl in version.txt erhöhen und pushen
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # nötig, um APKs an Releases zu hängen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel einrichten (falls Secrets vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – APK wird mit Debug-Schlüssel signiert. Updates lassen sich dann nicht über alte Versionen installieren (siehe README)."
          fi

      - name: Versionsnummer bestimmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          # Release nur auf main und nur, wenn es diese Version noch nicht gibt
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
             && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "DO_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease \
              -PversionCode=${{ github.run_number }} \
              -PversionName="$VERSION_NAME" 2>&1 | tee build.log; then
            # Fehler als Annotation ausgeben, damit sie direkt in der Übersicht stehen
            grep -E -A6 "^e: |What went wrong|error:" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "NotfallMesh-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: NotfallMesh-${{ env.VERSION_NAME }}
          path: NotfallMesh-*.apk

      - name: GitHub-Release mit APK erstellen
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Notfall-Mesh ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: NotfallMesh-*.apk
          generate_release_notes: true
