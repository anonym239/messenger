name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]          # Neues Release: git tag v1.0.0 && git push origin v1.0.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # nötig, um APKs an Releases zu hängen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signaturschlüssel einrichten (falls Secrets vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – APK wird mit Debug-Schlüssel signiert. Updates lassen sich dann nicht über alte Versionen installieren (siehe README)."
          fi

      - name: Versionsnummer bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "NotfallMesh-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NotfallMesh-${{ env.VERSION_NAME }}
          path: NotfallMesh-*.apk

      - name: GitHub-Release mit APK erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NotfallMesh-*.apk
          generate_release_notes: true
